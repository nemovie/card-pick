<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#3b6df0">
<title>카드 피킹 노트</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<!-- 로그인 화면 -->
<section id="login" class="login" hidden>
  <div class="login-box">
    <div class="logo">💳</div>
    <h1>카드 피킹 노트</h1>
    <p class="sub">지금, 이번 카드로 결제할지<br>똑똑하게 고르는 습관</p>
    <button id="btn-google" class="btn-google" type="button">
      <svg width="18" height="18" viewBox="0 0 48 48" aria-hidden="true"><path fill="#EA4335" d="M24 9.5c3.5 0 6.6 1.2 9.1 3.6l6.8-6.8C35.8 2.4 30.3 0 24 0 14.6 0 6.5 5.4 2.6 13.2l7.9 6.1C12.4 13.6 17.7 9.5 24 9.5z"/><path fill="#4285F4" d="M46.5 24.5c0-1.6-.1-3.1-.4-4.5H24v9h12.7c-.6 3-2.3 5.5-4.8 7.2l7.6 5.9c4.5-4.1 7-10.2 7-17.6z"/><path fill="#FBBC05" d="M10.5 28.7A14.5 14.5 0 0 1 9.5 24c0-1.6.3-3.2.9-4.7l-7.9-6.1A24 24 0 0 0 0 24c0 3.9.9 7.5 2.6 10.8l7.9-6.1z"/><path fill="#34A853" d="M24 48c6.5 0 11.9-2.1 15.9-5.8l-7.6-5.9c-2.1 1.4-4.9 2.3-8.3 2.3-6.3 0-11.6-4.1-13.5-9.8l-7.9 6.1C6.5 42.6 14.6 48 24 48z"/></svg>
      Google로 로그인
    </button>
    <p id="login-msg" class="msg" role="alert"></p>
  </div>
</section>

<!-- 앱 화면 -->
<div id="app" class="shell" hidden>
  <aside class="side">
    <div class="brand">💳 카드 피킹 노트</div>
    <nav id="nav-side"></nav>
  </aside>

  <main class="main">
    <header class="top">
      <div>
        <h1 id="page-title">카드 피킹 노트</h1>
        <p class="sub">지금, 이번 카드로 결제할지 <br>똑똑하게 고르는 습관</p>
      </div>
      <div class="top-right">
        <button id="btn-add" class="icon-btn" type="button" aria-label="사용 내역 추가">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>
        </button>
        <img class="mascot" src="images/header.png" alt="" width="720" height="360">
      </div>
    </header>
    <div id="view"></div>
  </main>

  <nav id="nav-tab" class="tabbar"></nav>
</div>

<div id="modal" class="modal" hidden></div>
<div id="toast" class="toast" hidden></div>
<script type="module" src="js/app.js"></script>
</body>
</html>
